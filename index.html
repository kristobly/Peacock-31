<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peacock 31</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Peacock 31</h1>

    <section id="game-controls">
        <button id="start-game-btn">Start Game (3 Players)</button>
        <button id="draw-stock-btn" disabled>Draw Stock</button>
        <button id="draw-discard-btn" disabled>Draw Discard</button>
        <button id="knock-btn" disabled>Knock</button>
        <button id="hammer-btn" disabled>Hammer</button>
        <button id="next-round-btn" disabled>Next Round</button>
        <button id="new-game-btn" style="display: none;">New Game</button>
    </section>

    <div id="game">
        <p><strong>Current Player:</strong> <span id="current-player">—</span></p>
        <p><strong>Phase:</strong> <span id="phase">—</span></p>
        <hr>
        <p><strong>Your Hand (Player 1):</strong> <span id="player-quarters"></span></p>
        <div id="player-hand"></div>
        <p><strong>Your Score:</strong> <span id="player-score">—</span></p>
        <hr>
        <p><strong>Top Discard:</strong> <span id="discard-top">—</span></p>
        <p><strong>Stock:</strong> <span id="stock-count">—</span> cards</p>
        <hr>
        <div id="other-players"></div>
    </div>

    <section id="round-summary" style="display: none;">
        <h3>Round Over!</h3>
        <div id="round-results"></div>
    </section>

    <hr>
    <section id="examples-section">
        <h3>Example Hands (for testing scoring)</h3>
        <button id="load-examples-btn">Load Example Hands</button>
        <p><strong>Example Hand:</strong> <span id="example-hand">—</span></p>
        <p><strong>Example Score:</strong> <span id="example-score">—</span></p>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
